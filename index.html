<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      href="/favicon-light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: light)"
    />

    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TV Mount Company | Professional TV Installation</title>

    <meta
      name="description"
      content="Professional TV mounting services with clean installation, hidden wires, same-day availability, and a 2-year warranty."
    />

    <meta name="theme-color" content="#ff6b3d" />

    <!-- Preload the LCP hero image so it starts downloading immediately,
         in parallel with the JS bundle, instead of after React renders.
         Each media query matches exactly the image the layout will show. -->
    <link
      rel="preload"
      as="image"
      href="/hero-mobile.webp"
      media="(max-width: 576px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero-tablet.webp"
      media="(min-width: 577px) and (max-width: 1024px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero.webp"
      media="(min-width: 1025px)"
      fetchpriority="high"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
