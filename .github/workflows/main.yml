name: Deploy TV Mount

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.242.63.233
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: bash /var/www/tv-mount/deploy/deploy.sh
